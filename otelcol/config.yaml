# ColdTrace OpenTelemetry Collector — the single telemetry switchboard.
#
# Apps export OTLP here (docker-compose default OTEL_EXPORTER_OTLP_ENDPOINT
# = otel-collector:4318); this collector ships traces, metrics AND logs to
# Datadog through the native exporter, plus APM stats via the connector.
#
# Datadog is the only backend: no vendor SDK in the apps, so the OTel
# pipeline stays portable.
#
# Validate:
#   docker run --rm -e DD_API_KEY=x \
#     -v "$PWD/otelcol/config.yaml:/etc/otelcol/config.yaml:ro" \
#     ghcr.io/open-telemetry/opentelemetry-collector-releases/opentelemetry-collector-contrib:0.164.0 \
#     validate --config=/etc/otelcol/config.yaml
receivers:
  otlp:
    protocols:
      http:
        endpoint: 0.0.0.0:4318
      grpc:
        endpoint: 0.0.0.0:4317

processors:
  memory_limiter:
    check_interval: 2s
    limit_mib: 256
  resourcedetection:
    detectors: [env, system]
    timeout: 2s
  resource:
    attributes:
      - key: deployment.environment
        value: hackathon
        action: upsert
  batch:
    timeout: 5s
    send_batch_size: 512

extensions:
  health_check:
    endpoint: 0.0.0.0:13133

connectors:
  # APM stats from unsampled traces — REQUIRED for Datadog APM views.
  # /connector suffix avoids the exporter/connector ID ambiguity.
  datadog/connector/connector:
    traces:
      compute_stats_by_span_kind: true
      peer_tags_aggregation: true
  # RED metrics from spans (spanmetrics connector). The datadog connector
  # above only feeds APM stats (backend views); custom spans like
  # ai.decision never became metrics — the dashboard's "AI decisions by
  # classification" tile queried trace.ai.decision.hits, a metric the
  # Datadog backend only generates for well-known HTTP spans, and
  # rendered empty forever. This connector turns every span into
  # traces.span.metrics.calls/duration with span attributes as tags
  # (OTel dots become underscores in Datadog: ai.decision -> ai_decision).
  # Dimensions deliberately exclude free-text (ai.reason) and high-cardinality
  # floats (ai.confidence): classification, fault class and device are the
  # chartable axes.
  spanmetrics/decision:
    namespace: traces.span.metrics
    dimensions:
      - name: ai.decision
      - name: ai.fault_class
      - name: ai.device

exporters:
  datadog/exporter:
    api:
      key: ${env:DD_API_KEY}
      site: ${env:DD_SITE:-datadoghq.com}
    host_metadata:
      enabled: false

service:
  telemetry:
    logs:
      level: info
  ## Readiness endpoint on :13133, used by the compose healthcheck.
  extensions: [health_check]
  pipelines:
    traces:
      receivers: [otlp]
      processors: [memory_limiter, resourcedetection, resource, batch]
      exporters: [datadog/connector/connector, datadog/exporter, spanmetrics/decision]
    traces/dd: # APM stats derived from the full trace stream
      receivers: [datadog/connector/connector]
      processors: [batch]
      exporters: [datadog/exporter]
    metrics:
      receivers: [otlp, datadog/connector/connector, spanmetrics/decision]
      processors: [memory_limiter, resourcedetection, resource, batch]
      exporters: [datadog/exporter]
    logs:
      receivers: [otlp]
      processors: [memory_limiter, resourcedetection, resource, batch]
      exporters: [datadog/exporter]
